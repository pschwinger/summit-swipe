<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>Summit Swipe</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Summit Swipe">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1ee;--card:#fff;--ink:#17212b;--muted:#5d6872;--line:#dde2de;--accent:#0e5f6c;--accent-soft:#e2eff0;--yes:#1f7a4a;--no:#a3262a;--top:#a86400;--top-soft:#fbf0dd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0e1418;--card:#18212a;--ink:#e8ecee;--muted:#9aa6b0;--line:#2a3640;--accent:#5fb3c0;--accent-soft:#16323a;--yes:#4cc285;--no:#ef6b6b;--top:#e2a548;--top-soft:#3a2c14;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1418;--card:#18212a;--ink:#e8ecee;--muted:#9aa6b0;--line:#2a3640;--accent:#5fb3c0;--accent-soft:#16323a;--yes:#4cc285;--no:#ef6b6b;--top:#e2a548;--top-soft:#3a2c14;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.45 "IBM Plex Sans",-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-inline:16px;box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 8px}
.top h1{font:800 18px/1 Archivo,sans-serif;margin:0;letter-spacing:-.01em}
.count{font:600 12px/1 "IBM Plex Sans",sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px}
.tab{font:600 12px/1 "IBM Plex Sans",sans-serif;padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stage{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.12);touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.card.back{transform:scale(.95) translateY(10px);opacity:.7;pointer-events:none}
.ph{flex:0 0 46%;min-height:0;position:relative;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;pointer-events:none}
.ph .ini{width:100%;height:100%;display:grid;place-items:center;font:800 64px Archivo,sans-serif;color:var(--muted)}
.ph .grad{position:absolute;inset:auto 0 0 0;padding:28px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}
.nm{font:800 24px/1.1 Archivo,sans-serif;margin:0;text-wrap:balance}
.rl{font-size:13px;opacity:.9;margin-top:4px}
.badge{position:absolute;top:12px;left:12px;font:600 10.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:5px;background:var(--top-soft);color:var(--top)}
.stamp{position:absolute;top:22px;font:800 26px/1 Archivo,sans-serif;letter-spacing:.04em;padding:6px 10px;border:3px solid;border-radius:8px;opacity:0;transform:rotate(-12deg)}
.stamp.y{left:18px;color:var(--yes)} .stamp.n{right:18px;color:var(--no);transform:rotate(12deg)} .stamp.t{left:50%;top:auto;bottom:16px;transform:translateX(-50%);color:var(--top)}
.info{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.q{font-style:italic;margin:0 0 4px;color:var(--ink)}
.h{font:600 10.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:14px 0 6px}
.info ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.src{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.src a{color:var(--accent)}
.btns{display:flex;justify-content:center;gap:18px;padding-block:12px calc(10px + env(safe-area-inset-bottom,0px))}
.b{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:800 22px/1 Archivo,sans-serif;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.b.n{color:var(--no)}.b.y{color:var(--yes)}.b.t{color:var(--top);width:48px;height:48px;align-self:center;font-size:18px}.b.u{color:var(--muted);width:42px;height:42px;align-self:center;font-size:16px}
.b span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.done{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.lists{flex:1;min-height:0;overflow-y:auto;padding-bottom:20px}
.lists h2{font:800 15px/1 Archivo,sans-serif;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.lists h2 i{font-style:normal;font:600 12px "IBM Plex Sans";color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.row img,.row .mi{width:38px;height:44px;border-radius:6px;object-fit:cover;object-position:top;background:var(--line);flex:none;display:grid;place-items:center;font:800 13px Archivo;color:var(--muted)}
.row b{display:block;font:600 14px/1.2 "IBM Plex Sans"}.row small{color:var(--muted);font-size:12px}
.row .mv{margin-left:auto;display:flex;gap:4px}
.row .mv button{font:600 11px "IBM Plex Sans";padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.act button{font:600 13px "IBM Plex Sans";padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.act button.pr{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 0}
textarea{position:absolute;left:-9999px}
</style>
<div class="app">
 <div class="top"><h1>Summit Swipe</h1><span class="count" id="count"></span>
  <div class="tabs"><button class="tab" id="t-swipe" aria-pressed="true">Swipen</button><button class="tab" id="t-list" aria-pressed="false">Listen</button></div></div>
 <div id="v-swipe" class="stage"></div>
 <div id="v-btns" class="btns">
  <button class="b u" id="b-undo"><span>Zurück</span>↶</button>
  <button class="b n" id="b-no"><span>Nein</span>✕</button>
  <button class="b t" id="b-top"><span>Top</span>★</button>
  <button class="b y" id="b-yes"><span>Treffen</span>✓</button>
 </div>
 <div id="v-list" class="lists" hidden></div>
</div>

function render(){
 const q=queue();
 document.getElementById('count').textContent=`${D.length-q.length}/${D.length}`;
 stage.innerHTML='';
 if(!q.length){stage.innerHTML='<div class="done"><div><p style="font:800 20px Archivo;color:var(--ink);margin:0 0 6px">Alle durch.</p><p>Unter „Listen“ siehst du deine Auswahl und kannst sie kopieren.</p></div></div>';return;}
 if(q[1]){const b=document.createElement('div');b.className='card back';b.innerHTML=cardHTML(q[1]);stage.appendChild(b);}
 const el=document.createElement('div');el.className='card';el.innerHTML=cardHTML(q[0]);stage.appendChild(el);
 drag(el,q[0]);
}
function decide(c,v,el,dx,dy){
 S[c.name]=v;hist.push(c.name);save();
 if(el){el.style.transition='transform .28s ease-out, opacity .28s';el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;el.style.opacity='0';setTimeout(render,260);}else render();
 if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
}
function drag(el,c){
 const info=el.querySelector('.info');
 let sx=0,sy=0,dx=0,dy=0,on=false,fromInfo=false,id=null;
 const st={y:el.querySelector('.stamp.y'),n:el.querySelector('.stamp.n'),t:el.querySelector('.stamp.t')};
 el.addEventListener('pointerdown',e=>{
  fromInfo=info.contains(e.target);on=true;id=e.pointerId;sx=e.clientX;sy=e.clientY;dx=dy=0;el.style.transition='none';
 });
 el.addEventListener('pointermove',e=>{
  if(!on||e.pointerId!==id)return;dx=e.clientX-sx;dy=e.clientY-sy;
  if(fromInfo&&Math.abs(dx)<Math.abs(dy)*1.2)return; /* vertical scroll inside text */
  if(Math.abs(dx)>6&&!el.hasPointerCapture(id))try{el.setPointerCapture(id)}catch(_){}
  const ty=fromInfo?0:Math.min(dy,0);
  el.style.transform=`translate(${dx}px,${ty}px) rotate(${dx/20}deg)`;
  st.y.style.opacity=Math.max(0,Math.min(1,dx/90));st.n.style.opacity=Math.max(0,Math.min(1,-dx/90));st.t.style.opacity=fromInfo?0:Math.max(0,Math.min(1,-dy/110))*(Math.abs(dx)<60?1:0);
 });
 const end=e=>{
  if(!on)return;on=false;
  const W=stage.clientWidth;
  if(dx>W*0.28)return decide(c,'yes',el,W*1.5,dy);
  if(dx<-W*0.28)return decide(c,'no',el,-W*1.5,dy);
  if(!fromInfo&&dy<-140&&Math.abs(dx)<60)return decide(c,'top',el,0,-stage.clientHeight*1.4);
  el.style.transition='transform .25s';el.style.transform='';Object.values(st).forEach(s=>s.style.opacity=0);
 };
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function btn(v){const q=queue();if(!q.length)return;const el=stage.querySelector('.card:not(.back)');const W=stage.clientWidth;
 decide(q[0],v,el,v==='yes'?W*1.5:v==='no'?-W*1.5:0,v==='top'?-stage.clientHeight*1.4:0);}
document.getElementById('b-yes').onclick=()=>btn('yes');
document.getElementById('b-no').onclick=()=>btn('no');
document.getElementById('b-top').onclick=()=>btn('top');
document.getElementById('b-undo').onclick=()=>{const n=hist.pop()||Object.keys(S).pop();if(n){delete S[n];save();render();}};
document.addEventListener('keydown',e=>{if(!document.getElementById('v-list').hidden)return;if(e.key==='ArrowRight')btn('yes');if(e.key==='ArrowLeft')btn('no');if(e.key==='ArrowUp')btn('top');});
const LBL={top:'★ Top',yes:'✓ Treffen',no:'✕ Nein'};
function lists(){
 const v=document.getElementById('v-list');
 const row=c=>`<div class="row">${c.img?`<img src="${c.img}" alt="">`:`<div class="mi">${esc(ini(c.name))}</div>`}<div><b>${esc(c.name)}</b><small>${esc(c.role)}</small></div><div class="mv">${['top','yes','no'].filter(k=>k!==S[c.name]).map(k=>`<button data-n="${esc(c.name)}" data-v="${k}">${LBL[k].split(' ')[0]}</button>`).join('')}</div></div>`;
 const grp=k=>{const a=D.filter(c=>S[c.name]===k);return `<h2>${LBL[k]} <i>${a.length}</i></h2>${a.map(row).join('')||'<p class="hint">Noch niemand.</p>'}`;};
 const open=queue();
 v.innerHTML=grp('top')+grp('yes')+grp('no')+`<h2>Noch offen <i>${open.length}</i></h2>`+
 `<div class="act"><button class="pr" id="cp">Auswahl kopieren</button><button id="rs">Alles zurücksetzen</button></div><p class="hint" id="cph">Kopierte Liste in den Chat mit Claude einfügen, dann werden Prioritäten und CRM danach gesetzt.</p>`;
 v.querySelectorAll('.mv button').forEach(b=>b.onclick=()=>{S[b.dataset.n]=b.dataset.v;save();lists();});
 document.getElementById('cp').onclick=async()=>{
  const t=['top','yes','no'].map(k=>LBL[k]+': '+(D.filter(c=>S[c.name]===k).map(c=>c.name).join(', ')||'-')).join('\n');
  try{await navigator.clipboard.writeText(t);document.getElementById('cph').textContent='Kopiert. Jetzt im Chat einfügen.';}
  catch(e){const ta=document.getElementById('clip');ta.value=t;ta.style.left='0';ta.select();document.getElementById('cph').textContent='Text markiert: jetzt „Kopieren“ wählen.';}
 };
 let arm=false;document.getElementById('rs').onclick=e=>{if(!arm){arm=true;e.target.textContent='Wirklich? Nochmal tippen';return;}S={};hist=[];save();lists();render();};
}
function tab(t){const L=t==='list';document.getElementById('t-swipe').setAttribute('aria-pressed',String(!L));document.getElementById('t-list').setAttribute('aria-pressed',String(L));
 document.getElementById('v-swipe').hidden=L;document.getElementById('v-btns').hidden=L;document.getElementById('v-list').hidden=!L;if(L)lists();else render();}
document.getElementById('t-swipe').onclick=()=>tab('swipe');document.getElementById('t-list').onclick=()=>tab('list');
render();
</script>

</body>
</html>
